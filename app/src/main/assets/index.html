<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>مطبخ البنات</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:linear-gradient(160deg,#fff4e8,#ffe3ef 45%,#ffe9d2);color:#3a2418;direction:rtl;padding-bottom:40px}
body.big{font-size:19px}
#app{max-width:580px;margin:0 auto;padding:10px 12px}
.topbar{display:flex;align-items:center;gap:8px;margin:6px 0}
.title{flex:1;text-align:center;font-weight:800;font-size:19px}
.ibtn{width:46px;height:46px;border-radius:15px;border:0;background:#fff;box-shadow:0 3px 10px rgba(160,90,40,.16);font-size:20px;color:#5a3a28;flex:0 0 auto}
.res{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:14px;margin-bottom:8px}
.chip{background:#fff;border-radius:999px;padding:6px 12px;box-shadow:0 2px 8px rgba(160,90,40,.12);font-weight:700}
.card{background:#fff;border-radius:20px;padding:14px;margin:10px 0;box-shadow:0 4px 16px rgba(170,100,60,.12)}
.ct{font-weight:800;font-size:17px;margin-bottom:8px;color:#8a3f5e}
.btn{display:block;width:100%;text-align:right;padding:14px 16px;margin:7px 0;border-radius:16px;border:0;background:#fff3e7;color:#4a2c1c;font-size:16px;font-weight:700;font-family:inherit;box-shadow:0 2px 6px rgba(170,110,70,.08)}
.btn:active{transform:scale(.985)}
.btn.p{background:linear-gradient(135deg,#ff7bb0,#ff5e8f);color:#fff}
.btn.g{background:linear-gradient(135deg,#6fd39a,#3fae6a);color:#fff}
.btn.o{background:linear-gradient(135deg,#ffb066,#ff8a3d);color:#fff}
.btn.d{background:#f1ece8;color:#9a8a7e}
.btn.sm{padding:10px 12px;font-size:14px;margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tile{background:#fff;border:0;border-radius:18px;padding:13px 12px;text-align:right;font-family:inherit;font-size:15px;font-weight:700;color:#4a2c1c;box-shadow:0 3px 12px rgba(170,100,60,.12);line-height:1.35}
.tile b{display:block;color:#ff5e8f;font-size:12px;margin-bottom:3px}
.grp{font-weight:800;color:#8a3f5e;margin:16px 4px 6px;font-size:15px}
.bar{height:11px;background:#ffe3d3;border-radius:99px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#ff8a3d,#ff5e8f);transition:width .3s}
.bar.g>i{background:linear-gradient(90deg,#6fd39a,#3fae6a)}
.bar.r>i{background:linear-gradient(90deg,#ff6b6b,#d63031)}
.small{font-size:13px;color:#8a6b58;line-height:1.5}
input{width:100%;padding:12px;border-radius:14px;border:2px solid #ffd7c2;font-size:16px;font-family:inherit;margin:6px 0;background:#fffdfb;color:#3a2418}
.row{display:flex;gap:8px;align-items:center}
.row .btn{flex:1}
.stars{color:#f5b301;font-size:18px;letter-spacing:2px}
.tag{display:inline-block;background:#ffe9f2;color:#c23d75;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;margin:2px}
.tag.g{background:#e4f7ec;color:#2e8a55}
.tag.o{background:#fff0dd;color:#c26a13}
.thumb{display:inline-flex;align-items:center;justify-content:center;width:92px;height:92px;border-radius:18px;margin:4px;font-size:30px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.5)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(90px);background:#3a2418;color:#fff;padding:13px 18px;border-radius:16px;font-weight:700;max-width:92%;text-align:center;opacity:0;transition:.25s;z-index:99;font-size:15px;line-height:1.5}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hero{background:linear-gradient(135deg,#ff8a3d,#ff5e8f);color:#fff;border-radius:24px;padding:18px;box-shadow:0 8px 24px rgba(255,94,143,.3)}
.hero .h1{font-size:22px;font-weight:900;margin-bottom:4px}
.hero .small{color:#fff3f7}
.hero .bar{background:rgba(255,255,255,.35)}
.hero .bar>i{background:#fff}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #f3ddd0;font-size:15px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:800}
.hint{background:#fff8ef;border:1px dashed #ffd2b8;border-radius:14px;padding:10px;font-size:13px;color:#8a6b58;margin:8px 0;line-height:1.5}
.center{text-align:center}
.bigbtn{padding:22px;font-size:19px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";

/* ===== البيانات الأساسية ===== */
var LS = "kitchen_v1";
var ICON = {coin:"🪙", heart:"💗", star:"⭐"};
var ING = {tomato:"طماطم", cucumber:"خيار", meat:"لحم", flour:"دقيق", sugar:"سكر", choco:"شوكولاتة", milk:"لبن", herb:"أعشاب", fruit:"فواكه"};
var DISHES = [
  {id:"salad", n:"سلطة طازجة", ing:["tomato","cucumber","herb"], base:10},
  {id:"burger", n:"برجر لحم", ing:["meat","flour","tomato"], base:16},
  {id:"cake", n:"كيك شوكولاتة", ing:["flour","sugar","choco"], base:20},
  {id:"pie", n:"فطيرة فواكه", ing:["flour","fruit","sugar"], base:18},
  {id:"soup", n:"شوربة خضار", ing:["tomato","herb","milk"], base:12},
  {id:"pasta", n:"مكرونة بالجبن", ing:["flour","milk","meat"], base:17}
];
var DRINKS = [
  {id:"latte", n:"لاتيه", fac:"espresso"},
  {id:"juice", n:"عصير فواكه", fac:"blender"},
  {id:"tea", n:"شاي بنعناع", fac:"tea"}
];
var NAMES = ["سارة","ملك","جنى","نور","ليلى","هنا","مريم","ياسمين","تاليا","داليدا","روان","شهد","لمار","حلا","بيان"];
var COMMENTS_GOOD = ["الأكل كان لذيذ جداً!","المكان نضيف ومرتب","خدمة سريعة وودودة","الحلويات تحفة","البوفيه رائع والمكان مريح"];
var COMMENTS_BAD = ["استنيت كتير على الطاولة","الطاولة مكانتش نضيفة","الأوردر جالها برد","الحمام محتاج تنظيف","المكان زحمة والخدمة بطيئة"];
var GARNISH = ["صوص شوكولاتة","فراولة مقطعة","ورق نعناع","كريمة مخفوقة","سكر ناعم","وردة سكرية"];
var CITIES = ["القاهرة","دبي","إسطنبول","لندن","طوكيو"];
var OUTFITS = ["مريلة وردي كلاسيك","فستان شيف بيج","يونيفورم أسود أنيق","بدلة شيف ذهبية"];
var HATS = ["قبعة بيضاء كلاسيك","قبعة وردي مزخرفة","قبعة سوداء عصرية","تاج شيف ذهبي"];
var ACCS = ["نظارة أنيقة","سلسلة قلب","أقراط لؤلؤ","ساعة ذهبية"];
var TRACKS = ["ألحان المطبخ الهادئة","موسيقى الصباح المبهجة","نغمات الحلويات","صوت مطر خفيف"];
var NOTIFS = ["جرس الباب","نغمة جاهزية الطلب","صوت خفيف","بدون صوت"];
var BGS = ["خلفية مطبخ دافئ","خلفية نجوم وردية","خلفية حديقة خضراء"];
var PALACE_ROOMS = ["حمام الزبائن الفاخر","صالة الكراسي","زينة الطاولات","أثاث وألوان المطبخ","إضاءة المطبخ","ركن القهوة"];
var ACH = [
  {id:"a1", n:"أول طبق", d:"حضّري أول طبق", s:1, chk:function(){return S.dishesMade>=1;}},
  {id:"a2", n:"شيف مبتدئة", d:"حضّري 5 أطباق", s:1, chk:function(){return S.dishesMade>=5;}},
  {id:"a3", n:"خدمة ممتازة", d:"اخدمي 10 زبائن", s:2, chk:function(){return S.served>=10;}},
  {id:"a4", n:"مطبخ نضيف", d:"اغسلي الأطباق 5 مرات", s:1, chk:function(){return S.washes>=5;}},
  {id:"a5", n:"نجمة التقييم", d:"وصلي لتقييم 4 نجوم", s:3, chk:function(){return S.rating>=4;}},
  {id:"a6", n:"صاحبة إمبراطورية", d:"افتحي أول فرع دولي", s:3, chk:function(){return S.branches.length>=1;}},
  {id:"a7", n:"شيف صاعدة", d:"واصلي للمستوى 5", s:2, chk:function(){return S.level>=5;}},
  {id:"a8", n:"قلب المطعم", d:"اجمعي 10 قلوب حب", s:2, chk:function(){return S.heartsLifetime>=10;}},
  {id:"a9", n:"مبتكرة", d:"اخترعي وصفة باسمك", s:2, chk:function(){return S.recipes.length>=1;}},
  {id:"a10", n:"ملكة الحفلات", d:"نظّمي 3 حفلات", s:2, chk:function(){return S.partiesDone>=3;}}
];
var STORY = [
  {n:"الفصل الأول: المفتاح القديم", d:"جدتك تركت لك مفتاح المطبخ الصغير في بيت العائلة.", need:function(){return true;}, rw:{coin:100}},
  {n:"الفصل الثاني: أول زبونة", d:"وصلت أول زبونة للمطعم الصغير، وعليك إسعادها.", need:function(){return S.served>=1;}, rw:{coin:150}},
  {n:"الفصل الثالث: دفتر الوصفات", d:"وجدتِ دفتر وصفات الجدة في الدرج السري.", need:function(){return S.dishesMade>=3;}, rw:{coin:200, heart:1}},
  {n:"الفصل الرابع: الشيف المنافس", d:"ظهر شيف منافس وفتح مطعماً بجوارك.", need:function(){return S.rating>=3.5;}, rw:{coin:350, star:1}},
  {n:"الفصل الخامس: الحلم الكبير", d:"قررتِ توسيع المطعم وفتح فرع دولي.", need:function(){return S.branches.length>=1;}, rw:{coin:600, heart:2}},
  {n:"الفصل السادس: مطبخ البنات العالمي", d:"اسمك بقى على كل لسان، وحلمك اتحقق.", need:function(){return S.level>=8;}, rw:{coin:1200, star:3}}
];

/* ===== الحالة ===== */
function defState(){
  return {
    coin:250, heart:3, star:0, xp:0, level:1,
    power:false, breakers:{main:false,kitchen:false,hall:false},
    stock:{tomato:4,cucumber:4,meat:3,flour:5,sugar:4,choco:3,milk:4,herb:3,fruit:4},
    spices:0, tray:[], recipes:[], ready:[], readyDrinks:[],
    cook:null, lastRate:null, dirty:0, washes:0, dishesMade:0,
    fac:{microwave:0,oven:0,fryer:0,dishwasher:0,espresso:0,blender:0,tea:0},
    tools:{knife:0,pan:0,mixer:0},
    deco:{bath:0,chairs:0,tableDeco:0,furniture:0,light:0,corner:0},
    tables:[null,null,null,null,null,null,null,null],
    vipMode:false, served:0, heartsLifetime:0, rating:3.0, reviews:[],
    staff:{waiter:1,cook:1,cleaner:0}, uniforms:0, badges:0, employeeOfMonth:"",
    girl:{outfit:0,hat:0,acc:0}, mirror:0,
    photos:[], photoBg:0,
    music:{track:0, notify:1, quiet:false, on:false},
    mail:[], cakePicks:[], marble:0,
    pets:{on:false, acc:0, clean:100},
    secrets:{box:false, book:false, potions:0},
    delivery:{scooter:0, orders:0, packed:0},
    gifts:{given:0, souvenirs:0, loved:0},
    garden:{tomatoAt:0, herbAt:0, watered:false},
    recycleMat:0, recycle:{decor:0,vases:0,candles:0},
    online:{hosted:0, wins:0},
    weatherDay:"", weather:"مشمس", umbrellas:false, winter:false,
    day:{date:"", gift:false, wheel:false, cook:0, serve:0, claims:[]},
    week:{key:"", serve:0, claimed:false},
    ach:[], story:0, branches:[], pending:0, totalEarned:0,
    robot:{on:false,bat:0,color:0,owns:false},
    experiments:[], magic:false, flavors:0,
    mg:{fruitsUntil:0, fruitsScore:0, fruitsBest:0, seq:[], input:[], juice:[], speedUntil:0, speedScore:0, speedBest:0, juiceSeq:[], juiceInput:[]},
    partiesDone:0, partiesCd:{},
    muted:false, autoRead:false, bigText:false, simple:false,
    cd:{}
  };
}
var S = defState();

function deepMerge(dst, src){
  for (var k in src){
    if (!Object.prototype.hasOwnProperty.call(src,k)) continue;
    if (src[k] && typeof src[k]==="object" && !Array.isArray(src[k]) && dst[k] && typeof dst[k]==="object" && !Array.isArray(dst[k])) deepMerge(dst[k], src[k]);
    else dst[k] = src[k];
  }
  return dst;
}
function load(){
  try{
    var raw = localStorage.getItem(LS);
    if (raw){ var o = JSON.parse(raw); if (o && typeof o==="object"){ S = deepMerge(defState(), o); } }
  }catch(e){}
  dailyReset();
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }

/* ===== أدوات ===== */
function rnd(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function todayKey(){ var d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function weekKey(){ var d=new Date(); var one=d.getTime()-((d.getDay()||7)-1)*86400000; var m=new Date(one); return m.getFullYear()+"-W"+(m.getMonth()+1)+"-"+m.getDate(); }
function fmtNum(n){ n=Math.floor(n); return String(n); }
function sfx(n){
  if (S.muted || S.music.quiet) return;
  try{
    var a = new Audio("sfx/"+n+".mp3");
    a.volume = 0.5;
    var p = a.play();
    if (p && p.catch) p.catch(function(){});
  }catch(e){}
}
function say(text){
  if (!text) return;
  window.__lastSpeech = text;
  if (S.muted) return;
  try{ if (window.Native && window.Native.speak){ window.Native.speak(text); return; } }catch(e){}
  try{
    if (window.speechSynthesis && window.SpeechSynthesisUtterance){
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "ar"; u.rate = 0.95;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}
function toast(msg){
  var d = document.getElementById("toast");
  if (d){ d.textContent = msg; d.className = "show"; clearTimeout(toast._t); toast._t = setTimeout(function(){ d.className=""; }, 3400); }
  say(msg);
}
function give(k,v){
  if (k==="coin"){ S.coin += v; S.totalEarned += Math.max(0,v); }
  else if (k==="heart"){ S.heart += v; if (v>0) S.heartsLifetime += v; }
  else if (k==="star") S.star += v;
  else if (k==="xp") addXp(v);
}
function spend(c){
  if (S.coin < c){ toast("معاكي " + S.coin + " عملة بس، محتاجة " + c); sfx("error"); return false; }
  S.coin -= c; return true;
}
function addXp(v){
  S.xp += v;
  var need = S.level*60;
  while (S.xp >= need){ S.xp -= need; S.level++; need = S.level*60; toast("مبروك! وصلتي للمستوى " + S.level); }
}
function cdLeft(key, ms){
  var t = S.cd[key] || 0;
  var left = ms - (Date.now() - t);
  return left > 0 ? Math.ceil(left/1000) : 0;
}
function cdStart(key){ S.cd[key] = Date.now(); }
function cdBtn(label, action, arg, key, ms, cls){
  var left = cdLeft(key, ms);
  if (left > 0) return '<button class="btn d" disabled>' + label + ' — انتظري ' + left + ' ث</button>';
  return b(label, action, arg, cls);
}
function hasIng(ing){ for (var i=0;i<ing.length;i++){ if ((S.stock[ing[i]]||0) <= 0) return false; } return true; }
function useIng(ing){ for (var i=0;i<ing.length;i++) S.stock[ing[i]] = (S.stock[ing[i]]||0) - 1; }
function dishById(id){
  for (var i=0;i<DISHES.length;i++) if (DISHES[i].id===id) return DISHES[i];
  for (var j=0;j<S.recipes.length;j++) if (S.recipes[j].id===id) return S.recipes[j];
  return null;
}
function dishName(id){ var d=dishById(id); return d?d.n:id; }
function dishBase(id){ var d=dishById(id); return d?d.base:15; }
function drinkName(id){ for (var i=0;i<DRINKS.length;i++) if (DRINKS[i].id===id) return DRINKS[i].n; return id; }
function starsTxt(n){ var s=""; for (var i=0;i<5;i++) s += i<n?"★":"☆"; return '<span class="stars">'+s+'</span>'; }
function powerOn(){ return S.power; }
function requirePower(){
  if (!powerOn()){ toast("الكهرباء مقفولة. روحي لقسم المخزن والكهرباء وشغّلي القواطع"); return false; }
  return true;
}

/* ===== التنقل والعرض ===== */
var cur = "home", STACK = [];
var SCREENS = {};
function render(){
  var y = 0;
  try{ y = window.scrollY || document.documentElement.scrollTop || 0; }catch(e){}
  var f = SCREENS[cur] || SCREENS.home;
  var el = document.getElementById("app");
  el.innerHTML = f();
  try{ window.scrollTo(0, y); }catch(e){}
}
function go(id, quiet){
  var changed = (cur !== id);
  if (changed){ STACK.push(cur); cur = id; }
  render();
  if (changed){ try{ window.scrollTo(0,0); }catch(e){} }
}
function back(){
  if (STACK.length){ cur = STACK.pop(); render(); return true; }
  cur = "home"; render(); return false;
}
window.gameBack = back;

function statsBar(){
  return '<div class="res"><span class="chip">'+ICON.coin+' '+fmtNum(S.coin)+'</span><span class="chip">'+ICON.heart+' '+S.heart+'</span><span class="chip">'+ICON.star+' '+S.star+'</span><span class="chip">مستوى '+S.level+'</span></div>';
}
function head(title){
  return '<div class="topbar"><button class="ibtn" onclick="act(\'back\')" aria-label="رجوع">⟵</button><div class="title">'+title+'</div></div>'+statsBar();
}
function card(t,body){ return '<div class="card"><div class="ct">'+t+'</div>'+body+'</div>'; }
function b(label,a,arg,cls){
  var oc = "act('"+a+"'";
  if (arg !== undefined && arg !== null) oc += ",'"+arg+"'";
  oc += ")";
  return '<button class="btn '+(cls||"")+'" onclick="'+oc+'">'+label+'</button>';
}
function bar(pct, cls){
  pct = Math.max(0, Math.min(100, pct));
  return '<div class="bar '+(cls||"")+'"><i style="width:'+pct+'%"></i></div>';
}
function pendingLine(){
  if (S.pending <= 0) return '';
  return '<div class="card" style="background:#fff5d6"><div class="kv"><span>أرباح محتاجة استلام من الكاشير</span><b>'+ICON.coin+' '+fmtNum(S.pending)+'</b></div>'+b("روحي للكاشير واستلمي", "go", "story", "o sm")+'</div>';
}

/* ===== اليوم والأسبوع ===== */
function dailyReset(){
  var t = todayKey();
  if (S.day.date !== t){ S.day = {date:t, gift:false, wheel:false, cook:0, serve:0, claims:[]}; }
  var w = weekKey();
  if (S.week.key !== w){ S.week = {key:w, serve:0, claimed:false}; }
  if (S.weatherDay !== t){
    S.weatherDay = t;
    var h = 0; for (var i=0;i<t.length;i++) h += t.charCodeAt(i);
    S.weather = ["مشمس","مطر","ثلج","غائم"][h % 4];
  }
}
function dayDishes(){
  var t = todayKey(); var h = 0; for (var i=0;i<t.length;i++) h += t.charCodeAt(i)*3;
  var out = [];
  for (var k=0;k<3;k++) out.push(DISHES[(h + k*2) % DISHES.length]);
  return out;
}
function checkAch(){
  for (var i=0;i<ACH.length;i++){
    var a = ACH[i];
    if (S.ach.indexOf(a.id) >= 0) continue;
    var ok = false;
    try{ ok = a.chk(); }catch(e){}
    if (ok){
      S.ach.push(a.id);
      S.star += a.s; S.coin += 50;
      (function(txt){ setTimeout(function(){ toast(txt); }, 400); })("وسام جديد: " + a.n + " +" + a.s + " نجمة");
    }
  }
}

/* ===== الأقسام ===== */
var SECTIONS = [
  {id:"cook", n:"تحضير الأطباق والابتكار", g:"المطبخ"},
  {id:"drinks", n:"المشروبات والعصائر", g:"المطبخ"},
  {id:"store", n:"المخزن والكهرباء", g:"المطبخ"},
  {id:"decor", n:"ديكور المطعم", g:"المطعم"},
  {id:"tables", n:"الطاولات والزبائن", g:"المطعم"},
  {id:"shop", n:"التسوق والأدوات", g:"المطعم"},
  {id:"staffstyle", n:"أزياء الطاقم", g:"المطعم"},

function missingList(){
  var dd = dayDishes();
  var need = {};
  for (var i=0;i<dd.length;i++){
    for (var k=0;k<dd[i].ing.length;k++){
      var key = dd[i].ing[k];
      need[key] = (need[key]||0) + 1;
    }
  }
  var out = "";
  for (var kk in need){
    var have = S.stock[kk]||0;
    if (have < need[kk]) out += '<span class="tag o">'+ING[kk]+' — محتاج '+(need[kk]-have)+'</span>';
  }
  return out || '<span class="tag g">كل المكونات موجودة</span>';
}

SCREENS.branches = function(){
  var h = head("التوسع العالمي والفروع");
  h += card("خطة التطوير الإقليمي",
    '<div class="small">افتحي فروع في مدن عالمية، وكل فرع بيجيب أرباح كل فترة.</div>'+
    '<div class="kv"><span>عدد الفروع</span><b>'+S.branches.length+'</b></div>'
  );
  for (var i=0;i<CITIES.length;i++){
    var city = CITIES[i];
    var cost = 500 * (i+1);
    var owned = null;
    for (var k=0;k<S.branches.length;k++) if (S.branches[k].city===i) owned = S.branches[k];
    if (owned){
      var lvl = owned.lvl||1;
      h += '<div class="card"><div class="kv"><span>فرع '+city+' — مستوى '+lvl+'</span><span class="tag g">مفتوح</span></div>'+
        '<div class="small">أرباح متراكمة: '+ICON.coin+' '+fmtNum(branchPending(owned))+'</div>'+
        '<div class="row">'+b("تحصيل الأرباح","branchCollect",String(i),"g sm")+b("ترقية الفرع","branchUp",String(i),"o sm")+'</div></div>';
    } else {
      h += '<div class="card"><div class="kv"><span>فتح فرع '+city+'</span><span class="small">'+cost+' عملة</span></div>'+
        b("افتحي الفرع","branchOpen",String(i),"p sm")+'</div>';
    }
  }
  return h;
};
function branchPending(o){
  var mins = Math.floor((Date.now() - (o.last||Date.now()))/60000);
  return Math.max(0, Math.min(600, mins * 3 * (o.lvl||1)));
}

/* ===== المحرك: كل الأزرار ===== */
function fin(){ checkAch(); save(); render(); }
function earn(n){ S.pending += Math.max(0, Math.round(n)); }
function bumpRating(d){ S.rating = Math.max(1, Math.min(5, Math.round((S.rating + d)*100)/100)); }
function num(x){ var n = Number(x); return isFinite(n) ? n : 0; }

function makeGuest(vip){
  return {
    name: pick(NAMES),
    food: pick(DISHES).id,
    drink: pick(DRINKS).id,
    at: Date.now(),
    vip: !!vip
  };
}
function guestReward(g){
  var p = patLeft(g)/100;
  var base = dishBase(g.food) + 8;
  var tip = Math.round(base * (0.6 + p*0.8) * (g.vip?2:1));
  return tip;
}

function act(a, arg, arg2){
  var n = num(arg);
  switch(a){

  /* التنقل */
  case "back": back(); return;
  case "go": if (arg) go(String(arg)); return;
  case "photoBg": S.photoBg = n; fin(); return;

  /* 1. المطبخ */
  case "tray":
    if (!(S.stock[arg] > 0)){ toast("مفيش " + ING[arg] + " في المخزن"); return; }
    var ti = S.tray.indexOf(arg);
    if (ti >= 0){ S.tray.splice(ti,1); }
    else {
      if (S.tray.length >= 3){ toast("الصينية بتاخد 3 مكونات بس"); return; }
      S.tray.push(arg);
    }
    save(); render(); return;

  case "trayClear": S.tray = []; fin(); return;

  case "trayGuess":
    if (S.tray.length !== 3){ toast("اختاري 3 مكونات الأول"); return; }
    var match = null;
    for (var i=0;i<DISHES.length;i++){
      var okAll = true;
      for (var k=0;k<DISHES[i].ing.length;k++){
        if (S.tray.indexOf(DISHES[i].ing[k]) < 0){ okAll = false; break; }
      }
      if (okAll && DISHES[i].ing.length === S.tray.length){ match = DISHES[i]; break; }
    }
    if (match){
      toast("دي وصفة " + match.n + " — تقدر تطبخها من القائمة");
      say("المكونات دي بتعمل " + match.n);
    } else {
      toast("مكونات جديدة! سمّي الطبق من مربع الابتكار");
      say("دي وصفة جديدة. اكتبي اسمها وسعرها");
    }
    save(); render(); return;

  case "nameDish":
    if (S.tray.length !== 3){ toast("الصينية محتاجة 3 مكونات"); return; }
    var elN = document.getElementById("dname");
    var elP = document.getElementById("dprice");
    var nm = elN ? elN.value.replace(/^\s+|\s+$/g,"") : "";
    var pr = elP ? num(elP.value) : 0;
    if (nm.length < 2){ toast("اكتبي اسم للطبق"); return; }
    if (pr < 5){ toast("حددي سعر 5 عملات على الأقل"); return; }
    var exists = false;
    for (var q=0;q<S.recipes.length;q++) if (S.recipes[q].n === nm) exists = true;
    if (exists){ toast("فيه وصفة بنفس الاسم"); return; }
    S.recipes.push({ id:"r"+Date.now(), n:nm, ing:S.tray.slice(), base:Math.round(pr) });
    S.tray = []; give("xp",10);
    toast("الوصفة اتضافت للقائمة: " + nm);
    fin(); return;

  case "cookStart":
    var d = dishById(String(arg));
    if (!d){ toast("وصفة غير معروفة"); return; }
    if (!requirePower()) return;
    if (!hasIng(d.ing)){ toast("مكونات ناقصة — اشتري من المتجر"); return; }
    useIng(d.ing);
    S.cook = { id:d.id, n:d.n, ing:d.ing.slice(), cut:0, done:0, temp:180, garn:[], burnt:false };
    go("cut"); return;

  case "cookCut":
    if (!S.cook){ toast("مفيش طبق"); return; }
    if (S.cook.cut >= 3){ toast("التقطيع خلص"); return; }
    S.cook.cut++;
    sfx("click");
    if (S.cook.cut >= 3) say("التقطيع خلص. تقدري تروحي للطهي");
    fin(); return;

  case "cookToStove":
    if (!S.cook) return;
    if (S.cook.cut < 3){ toast("لسه محتاج تقطيع"); return; }
    go("stove"); return;

  case "setTemp":
    if (!S.cook) return;
    S.cook.temp = n;
    save(); render();
    say("درجة الحرارة " + n + " درجة");
    return;

  case "cookProgress":
    if (!S.cook) return;
    if (!requirePower()) return;
    var c = S.cook;
    var temp = c.temp || 180;
    var inc;
    if (temp === 160) inc = rnd(12,18);
    else if (temp === 180) inc = rnd(20,28);
    else if (temp === 200) inc = rnd(26,34);
    else inc = rnd(34,44);
    c.done = Math.min(110, c.done + inc);
    if (temp === 220 && Math.random() < 0.32) c.burnt = true;
    if (temp === 200 && Math.random() < 0.1) c.burnt = true;
    if (c.done >= 100){ c.done = 100; c.burnt = c.burnt || temp >= 220; }
    if (c.burnt) say("خدي بالك! الطبق بدأ يتحرق");
    else if (c.done >= 50) say("الطبق استوى. تقدري ترفعيه");
    else say("لسه بيستوي");
    fin(); return;

  case "cookToDeco":
    if (!S.cook) return;
    if (S.cook.done < 50){ toast("لسه محتاج نضج أكتر"); return; }
    go("deco"); return;

  case "garnish":
    if (!S.cook) return;
    var gi = S.cook.garn.indexOf(n);
    if (gi >= 0) S.cook.garn.splice(gi,1);
    else {
      if (S.cook.garn.length >= 3){ toast("3 لمسات تكفي"); return; }
      S.cook.garn.push(n);
    }

    if (!spend(250)) return;
    S.secrets.book = true;
    toast("الكتاب اتفتح — جودة كل الأطباق زادت");
    fin(); return;

  case "secretPotion":
    if (S.heart < 1){ toast("محتاجة قلب واحد"); return; }
    S.heart--;
    S.secrets.potions++;
    toast("صنعتي جرعة سعادة");
    fin(); return;

  case "usePotion":
    if (S.secrets.potions <= 0){ toast("مفيش جرعات"); return; }
    S.secrets.potions--;
    bumpRating(0.1);
    S.star += 1;
    toast("الطاقم مبسوط — التقييم طلع");
    fin(); return;

  /* 16. التوصيل */
  case "delOrder":
    S.delivery.orders++;
    sfx("bell");
    toast("طلب توصيل جديد");
    fin(); return;

  case "delPack":
    if (S.delivery.orders <= 0){ toast("مفيش طلبات مستلمة"); return; }
    if (!spend(5)) return;
    S.delivery.orders--;
    S.delivery.packed++;
    toast("حقيبة ورقية مجهزة");
    fin(); return;

  case "delSend":
    if (S.delivery.packed <= 0){ toast("مفيش حقائب مجهزة"); return; }
    var pay = S.delivery.packed * (25 + S.delivery.scooter*12);
    S.delivery.packed = 0;
    earn(pay);
    give("xp",6);
    sfx("success");
    toast("التوصيل طار — +" + pay + " في الكاشير");
    fin(); return;

  case "delUp":
    if (S.delivery.scooter >= 5){ toast("السكوتر في أعلى مستوى"); return; }
    if (!spend((S.delivery.scooter+1)*150)) return;
    S.delivery.scooter++;
    toast("السكوتر اتطور — مستوى " + S.delivery.scooter);
    fin(); return;

  /* 17. الهدايا */
  case "giftGuest":
    if (!spend(70)) return;
    S.gifts.given++;
    S.gifts.loved += 5;
    give("heart",1);
    toast("الزبونة فرحت بالهدية — +قلب و+5 نقاط حب");
    fin(); return;

  case "souvenir":
    if (!spend(40)) return;
    S.gifts.souvenirs++;
    earn(70);
    toast("التذكار اتباع — +70 في الكاشير");
    fin(); return;

  case "loveDeco":
    if (S.gifts.loved < 10){ toast("محتاجة 10 نقاط حب"); return; }
    S.gifts.loved -= 10;
    bumpRating(0.1);
    S.star += 1;
    toast("ديكور حصري جديد في المطعم");
    fin(); return;

  /* 18. الإعدادات */
  case "srTest":
    say("اختبار قارئ الشاشة: زر رجوع، وكل الأزرار ليها اسم واضح");
    save(); return;

  case "simple":
    S.simple = !S.simple;
    toast(S.simple ? "اللغة المبسطة شغالة" : "رجعنا للنص العادي");
    fin(); return;

  case "bigText":
    S.bigText = !S.bigText;
    try{ document.body.className = S.bigText ? "big" : ""; }catch(e){}
    toast(S.bigText ? "الخط كبير" : "الخط عادي");
    fin(); return;

  case "mute":
    S.muted = !S.muted;
    toast(S.muted ? "الصوت اتكتم" : "الصوت رجع");
    save(); render(); return;

  case "resetAsk":
    var last = S.cd.resetAsk || 0;
    if (last && Date.now() - last < 10000){
      S = defState();
      dailyReset();
      try{ document.body.className = ""; }catch(e){}
      save();
      STACK = []; cur = "home"; render();
      toast("اللعبة رجعت من الأول");
      return;
    }
    S.cd.resetAsk = Date.now();
    toast("اضغطي تاني خلال 10 ثواني للتأكيد");
    save(); render(); return;

  case "report":
    say("تقرير رضا العملاء: متوسط التقييم " + S.rating.toFixed(1) + " من 5، وعدد الآراء " + S.reviews.length + "، وعدد الزبائن اللي خدموا " + S.served);
    toast("التقرير اتقرا");
    save(); return;

  /* 19. الحديقة */
  case "plant":
    var pCost = arg === "tomatoAt" ? 12 : 10;
    if (S.garden[arg]){ toast("فيه زرع بالفعل"); return; }
    if (!spend(pCost)) return;
    S.garden[arg] = Date.now();
    toast("الزرع بدأ — استني 45 ثانية");
    fin(); return;

  case "harvest":
    var hKey = arg === "tomato" ? "tomatoAt" : "herbAt";
    var at = S.garden[hKey];
    if (!at){ toast("مفيش زرع هنا"); return; }
    var growSec = S.garden.watered ? 20 : 45;
    if (Date.now() - at < growSec*1000){ toast("لسه بينمو — استني " + Math.ceil((growSec*1000-(Date.now()-at))/1000) + " ث"); return; }
    S.garden[hKey] = 0;
    if (arg === "tomato") S.stock.tomato += 3;
    else S.stock.herb += 3;
    give("xp",5);
    toast("حصاد ناجح — +3 " + (arg==="tomato"?"طماطم":"أعشاب"));
    fin(); return;

  case "water":
    S.garden.watered = !S.garden.watered;
    toast(S.garden.watered ? "الري التلقائي شغال — الحصاد أسرع" : "الري وقف");
    fin(); return;

  /* 20. إعادة التدوير */
  case "craft":
    var needM = {decor:5, vase:3, candle:4};
    var keyC = arg === "vase" ? "vases" : arg;
    if (needM[arg] === undefined){ toast("صنعة غير معروفة"); return; }
    if (S.recycleMat < needM[arg]){ toast("محتاجة " + needM[arg] + " خامات — ارمي بقايا من المخزن"); return; }
    S.recycleMat -= needM[arg];
    S.recycle[keyC]++;
    bumpRating(0.03);
    give("xp",6);
    toast("اتصنعت — بقى عندك " + S.recycle[keyC]);
    fin(); return;

  /* 21. الطاقم */
  case "uniform":
    if (S.uniforms >= 5){ toast("الزي في أعلى مستوى"); return; }
    if (!spend(120)) return;
    S.uniforms++;
    bumpRating(0.05);
    toast("الطاقم بقى أنيق — مستوى " + S.uniforms);
    fin(); return;

  case "badge":
    if (!spend(50)) return;
    S.badges++;
    toast("بطاقة تعريف جاهزة");
    fin(); return;

  case "employee":
    S.employeeOfMonth = arg;
    bumpRating(0.15);
    give("heart",1);
    toast("اتكرمت " + arg + " — الطاقم فرحان");
    fin(); return;

  /* 22. أونلاين */
  case "online":
    if (arg === "party"){
      if (!spend(150)) return;
      cdStart("o_party");
      S.online.hosted++;
      S.partiesDone++;
      give("heart",2);
      bumpRating(0.1);
      toast("حفلة المطبخ الجماعية بدأت — +2 قلب");
    } else if (arg === "cup"){
      cdStart("o_cup");
      if (Math.random() < 0.5){
        S.online.wins++;
        S.star += 3;
        earn(120);
        toast("كسبتي الكأس الذهبية! +3 نجوم");
      } else {
        earn(30);
        toast("المنافسة كانت قوية — +30 في الكاشير");
      }
    }
    fin(); return;

  case "onlineGift":
    if (cdLeft("onlineGift", 300000) > 0){ toast("استني " + cdLeft("onlineGift",300000) + " ث"); return; }
    cdStart("onlineGift");
    S.gifts.loved += 3;
    give("heart",1);
    S.mail.unshift({ t:"صديقة من اللعبة", d:"شكراً على تبادل الوصفة! بعتتلك قلب." });
    if (S.mail.length > 20) S.mail.pop();
    toast("اتبادلت وصفة — +قلب ورسالة جديدة");
    fin(); return;

  /* 23. المشروبات */
  case "makeDrink":
    if (!requirePower()) return;
    var dCost = {latte:8, cappuccino:8, mocha:10, juice:8, tea:6};
    var dc = dCost[arg];
    if (dc === undefined){ toast("مشروب غير معروف"); return; }
    if (arg === "juice" && !S.stock.fruit){ toast("محتاجة فواكه — اشتري من المتجر"); return; }
    if (arg === "tea" && !S.stock.herb){ toast("محتاجة أعشاب — ازرعي في الحديقة"); return; }
    if (!spend(dc)) return;
    if (arg === "juice") S.stock.fruit--;
    if (arg === "tea") S.stock.herb--;
    S.readyDrinks.push(arg);
    sfx("success");
    toast("المشروب جاهز: " + drinkLabel(arg));
    fin(); return;

  /* 24. المكافآت */
  case "dailyGift":
    if (S.day.gift){ toast("استلمتي هدية النهارده — تعالي بكرة"); return; }
    S.day.gift = true;
    var g1 = rnd(50,120);
    give("coin", g1);
    if (Math.random() < 0.3) give("heart",1);
    sfx("collect");
    toast("هدية النهارده: " + g1 + " عملة");
    fin(); return;

  case "wheel":
    if (S.day.wheel){ toast("لفّيتي العجلة النهارده"); return; }
    S.day.wheel = true;
    var prizes = [ {k:"coin",v:80}, {k:"coin",v:150}, {k:"star",v:1}, {k:"heart",v:1}, {k:"coin",v:40}, {k:"star",v:2} ];
    var pz = pick(prizes);
    if (pz.k === "coin") give("coin", pz.v);
    else if (pz.k === "heart") give("heart", pz.v);
    else S.star += pz.v;
    sfx("wheel");
    toast("العجلة وقفت على: " + (pz.k==="coin"?pz.v+" عملة":(pz.k==="star"?pz.v+" نجمة":"قلب حب")));
    fin(); return;

  case "weekClaim":
    if (S.week.claimed){ toast("استلمتي الوسام هذا الأسبوع"); return; }
    if (S.week.serve < 15){ toast("محتاجة تخدمي 15 زبونة هذا الأسبوع"); return; }
    S.week.claimed = true;
    S.star += 5;
    give("coin",300);
    toast("وسام الشيف الذهبي الملكي بقى ليكي! +5 نجوم");
    fin(); return;

  case "claimDaily":
    if (S.day.claims.indexOf(arg) >= 0){ toast("اتسلمت النهارده"); return; }
    if (arg === "cook"){
      if (S.day.cook < 3){ toast("لسه محتاجة تطبخي 3 أطباق"); return; }
      S.day.claims.push("cook");
      give("coin",60); S.star += 1;
      toast("تحدي الطبخ خلص — +60 عملة");
    } else if (arg === "serve"){
      if (S.day.serve < 3){ toast("لسه محتاجة تخدمي 3 زبائن"); return; }
      S.day.claims.push("serve");
      give("coin",60); S.star += 1;
      toast("تحدي الخدمة خلص — +60 عملة");
    }
    fin(); return;

  /* 25. النكهات */
  case "flavor":
    if (!spend(25)) return;
    var f1 = pick(Object.keys(ING)), f2 = pick(Object.keys(ING));
    var names = [ING[f1], ING[f2]];
    S.experiments.push({ n:"تجربة " + (S.experiments.length+1), d:names[0] + " + " + names[1] + " — طعم " + pick(["حلو","حامي","غريب","لذيذ","مجنون"]) });
    if (S.experiments.length > 30) S.experiments.shift();
    if (Math.random() < 0.2){ S.magic = true; toast("طلعت نكهة سحرية! هتتحسب في الطبق الجاي"); }
    else toast("تجربة جديدة اتسجلت في السجل");
    fin(); return;

  case "magicOn":
    if (S.magic){ toast("النكهة السحرية جاهزة بالفعل"); return; }
    if (!spend(50)) return;
    S.magic = true;
    toast("الماكينة شغالة — الطبق الجاي هيكون مميز");
    fin(); return;

  /* 26. الروبوت */
  case "robotToggle":
    if (!S.robot.on){
      if (!spend(300)) return;
      S.robot.on = true;
      S.robot.owns = true;
      toast("الروبوت المساعد اتشغل — بيغسل وينظّم");
    } else {
      S.robot.on = false;
      toast("الروبوت اتوقف");
    }
    fin(); return;

  case "robotBat":
    if (S.robot.bat >= 5){ toast("البطارية في أعلى مستوى"); return; }
    if (!spend((S.robot.bat+1)*80)) return;
    S.robot.bat++;
    toast("البطارية اتقوت — مستوى " + S.robot.bat);
    fin(); return;

  case "robotColor":
    if (!spend(40)) return;
    S.robot.color = (S.robot.color + 1) % 4;
    toast("شكل الروبوت اتغير");
    fin(); return;

  /* 27. الطقس */
  case "winter":
    if (!S.winter){ if (!spend(120)) return; S.winter = true; bumpRating(0.05); toast("ركن المشروبات الساخنة اتفتح"); }
    else { S.winter = false; toast("الركن اتقفل"); }
    fin(); return;

  case "umbrella":
    if (!S.umbrellas){ if (!spend(90)) return; S.umbrellas = true; toast("المظلات اتجهزت للمطر والثلج"); }
    else { S.umbrellas = false; toast("المظلات اتشالت"); }
    fin(); return;

  /* 28. الإحصائيات */
  case "badgeAward":
    if (S.rating < 4){ toast("وسام الأداء محتاج تقييم 4 نجوم"); return; }
    if (S.cd.badgeAward && Date.now() - S.cd.badgeAward < 86400000){ toast("استلمتي الوسام النهارده"); return; }
    S.cd.badgeAward = Date.now();
    S.star += 2;
    give("coin",100);
    toast("وسام الأداء المتميز — +2 نجمة");
    fin(); return;

  case "idea":
    if (!spend(45)) return;
    var ia = pick(Object.keys(ING)), ib = pick(Object.keys(ING)), ic = pick(Object.keys(ING));
    S.experiments.push({ n:"فكرة وصفة " + (S.experiments.length+1), d:ING[ia] + " + " + ING[ib] + " + " + ING[ic] });
    if (S.experiments.length > 30) S.experiments.shift();
    toast("فكرة جديدة: " + ING[ia] + " + " + ING[ib] + " + " + ING[ic]);
    fin(); return;

  default:
    toast("الزر ده مش متاح");
    return;
  }
}

/* ===== التشغيل ===== */
try{ if (location.hash === "#reset") localStorage.removeItem(LS); }catch(e){}
load();
try{ document.body.className = S.bigText ? "big" : ""; }catch(e){}
render();
</script>
</body>
</html>
