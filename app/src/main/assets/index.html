var LB_SEEDS = [
  {n:"مريم", s:780}, {n:"سارة", s:640}, {n:"جنى", s:560},
  {n:"ريم", s:470}, {n:"نور", s:380}, {n:"هنا", s:300}, {n:"ملك", s:220}
];
function inputVal(id){
  var e = document.getElementById(id);
  return e && e.value ? String(e.value).trim() : "";
}
function myScore(){
  return S.level*100 + S.served*10 + Math.floor(S.totalEarned/40) + S.star*5;
}
function normName(x){ return String(x || "").trim().toLowerCase().replace(/\s+/g, " "); }
function friendEntry(f){
  if (!f) return null;
  var now = Date.now();
  if (f.id && NET.lb[f.id] && now - (NET.lb[f.id].ts || 0) < 90000) return NET.lb[f.id];
  var want = normName(f.n);
  for (var id in NET.lb){
    var e = NET.lb[id];
    if (!e || !e.n) continue;
    if (now - (e.ts || 0) > 90000) continue;
    if (normName(e.n) === want) return e;
  }
  return null;
}
function friendLastSeen(f){
  if (!f) return 0;
  if (f.id && NET.lb[f.id]) return NET.lb[f.id].ts || 0;
  var want = normName(f.n), best = 0;
  for (var id in NET.lb){
    var e = NET.lb[id];
    if (!e || !e.n) continue;
    if (normName(e.n) === want && (e.ts || 0) > best) best = e.ts || 0;
  }
  return best;
}
function friendsOnlineCount(){
  var n = 0;
  for (var i = 0; i < S.online.friends.length; i++) if (friendEntry(S.online.friends[i])) n++;
  return n;
}
function friendRoomOf(f){
  if (!f) return null;
  var want = normName(f.n), now = Date.now();
  for (var k in NET.rooms){
    var r = NET.rooms[k];
    if (!r || !r.open) continue;
    if (now - (r.ts || 0) > 180000) continue;
    if (normName(r.owner) === want) return r;
  }
  return null;
}
function lbRows(includeSeeds){
  var rows = [], seen = {};
  rows.push({n:S.online.nick, s:myScore(), me:true, id:NET.id, key:NET.id});
  seen[S.online.nick] = 1;
  for (var id in NET.lb){
    var e = NET.lb[id];
    if (!e || !e.n || id === NET.id) continue;
    if (Date.now() - (e.ts || 0) > 86400000) continue;
    if (seen[e.n]) continue;
    seen[e.n] = 1;
    rows.push({n:e.n, g:e.g || "بنت", s:e.s || 0, me:false, id:id, key:id});
  }
  if (includeSeeds){
    for (var i=0;i<LB_SEEDS.length;i++){
      if (seen[LB_SEEDS[i].n]) continue;
      seen[LB_SEEDS[i].n] = 1;
      rows.push({n:LB_SEEDS[i].n, g:"بنت", s:LB_SEEDS[i].s, me:false, id:"", key:"n:"+LB_SEEDS[i].n});
    }
  }
  rows.sort(function(a,b){ return b.s - a.s; });
  return rows;
}
function myRank(){
  var rows = lbRows(NET.state !== "on");
  for (var i=0;i<rows.length;i++) if (rows[i].me) return i + 1;
  return rows.length;
}

}

}

/* ===== 23. القناة المجانية بين الموبايلات ===== */
var MQ_URL = "wss://broker.emqx.io:8084/mqtt";
var TOPIC = "waadkitchen/v1/gk/";
var NET = {c:null, state:"off", id:"", rooms:{}, peers:{}, lb:{}, joined:"", timer:null, _lbAt:0};

function hashPass(s){
  var h = 5381;
  for (var i=0;i<s.length;i++) h = ((h*33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
function randCode(len){
  var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", out = "";
  for (var i=0;i<len;i++) out += chars.charAt(Math.floor(Math.random()*chars.length));
  return out;
}
function netCid(){
  try{
    if (!S.net) S.net = {};
    if (S.net.cid) return S.net.cid;
    var s = "gk" + Math.random().toString(36).slice(2,8) + Math.random().toString(36).slice(2,6);
    S.net.cid = s;
    save();
    return s;
  }catch(e){ return "gk" + Math.random().toString(36).slice(2,10); }
}
function netPublish(topic, obj){
  try{ if (NET.c && NET.c.connected) NET.c.publish(TOPIC + topic, JSON.stringify(obj), {qos:0, retain:false}); }catch(e){}
}
function netPublishRetain(topic, obj){
  try{ if (NET.c && NET.c.connected) NET.c.publish(TOPIC + topic, JSON.stringify(obj), {qos:0, retain:true}); }catch(e){}
}
function netClearRetain(topic){
  try{ if (NET.c && NET.c.connected) NET.c.publish(TOPIC + topic, "", {qos:0, retain:true}); }catch(e){}
}
function netSub(topic){ try{ if (NET.c) NET.c.subscribe(TOPIC + topic); }catch(e){} }

function netInit(){
  if (NET.c) return;
  if (typeof mqtt === "undefined"){ NET.state = "unavailable"; return; }
  NET.id = netCid();
  NET.state = "connecting";
  try{
    NET.c = mqtt.connect(MQ_URL, {clientId: NET.id, clean:true, reconnectPeriod:6000, connectTimeout:12000, keepalive:30});
  }catch(e){ NET.state = "unavailable"; return; }
  NET.c.on("connect", function(){
    NET.state = "on";
    netSub("rooms/+/meta");
    netSub("lb/+");
    netSub("req/" + NET.id);
    netSub("dm/" + NET.id);
    netSub(backupTopic());
    if (S.online.room && S.online.room.mine){
      if (!S.online.room.code) S.online.room.code = randCode(5);
      S.online.room.live = true;
      nameJoin(S.online.room.code);
      netAnnounceRoom();
    } else if (S.online.room && S.online.room.live && S.online.room.code){
      nameJoin(S.online.room.code);
    }
    netPublishLb();
    setTimeout(function(){ pushBackup(true); }, 1500);
    if (cur === "online" || cur === "room" || cur === "leaderboard") render();
  });
  NET.c.on("close", function(){ if (NET.state === "on"){ NET.state = "off"; netRender(); } });
  NET.c.on("error", function(){ NET.state = "off"; });
  NET.c.on("message", function(t, p){ try{ netMessage(t, JSON.parse(String(p))); }catch(e){} });
  if (!NET.timer) NET.timer = setInterval(netTick, 6000);
}

function netTick(){
  if (NET.state !== "on") return;
  if (PTT.on && Date.now() - PTT.t0 > 60000) pttStop();
  if (NET.joined){
    var myTeam = (S.online.room && S.online.room.myTeam) || "";
    netPublish("rooms/" + NET.joined + "/presence", {t:"hb", id:NET.id, n:S.online.nick, g:S.online.gender, s:myScore(), mic:!!S.online.mic, team:myTeam});
    var ch = false, now = Date.now();
    for (var k in NET.peers){
      if (now - NET.peers[k].last > 30000){ delete NET.peers[k]; ch = true; }
    }
    if (ch) netRender();
  }
  if (S.online.room && S.online.room.mine) netAnnounceRoom();
  if (Date.now() - NET._lbAt > 30000) netPublishLb();
}

function netAnnounceRoom(){
  var r = S.online.room;
  if (!r || !r.mine) return;
  if (!r.code) r.code = randCode(5);
  var bots = [];
  for (var i=0;i<r.players.length;i++){
    var p = r.players[i];
    bots.push({n:p.n, g:p.g, s:p.score||0});
  }
  netPublishRetain("rooms/" + r.code + "/meta", {
    code:r.code, name:r.name, owner:S.online.nick, host:NET.id,
    priv:!!r.priv, ph:(r.pass ? hashPass(r.pass) : ""), open:!!r.open,
    started:!!r.started, bots:bots, mode:(r.mode||"compete"), ta:(r.ta||""), tb:(r.tb||""), ts:Date.now()
  });
}
function netCloseRoom(){
  var r = S.online.room;

function netLeave(){

  netPublish("rooms/" + NET.joined + "/presence", {t:"leave", id:NET.id, n:S.online.nick});
  NET.joined = "";
  NET.peers = {};

function netMessage(t, m){
  if (!t || t.indexOf(TOPIC) !== 0 || !m) return;
  var parts = t.slice(TOPIC.length).split("/");
  if (parts[0] === "req"){ netReq(m); return; }
  if (parts[0] === "dm"){ netDm(m); return; }
  if (parts[0] === "lb"){
    var lid = parts[1];
    if (!m.n){ delete NET.lb[lid]; return; }
    m.ts = m.ts || Date.now();
    m.id = lid;
    NET.lb[lid] = m;
    if (cur === "leaderboard") netRender();
    return;
  }
  if (parts[0] === "save"){ netSave(m); return; }
  if (parts[0] !== "rooms") return;
  var code = parts[1], kind = parts[2];
  if (kind === "meta"){
    if (!m.code || !m.ts || Date.now() - m.ts > 180000){ delete NET.rooms[code]; return; }
    NET.rooms[code] = m;
    netRender();
    return;
  }
  if (code !== NET.joined) return;
  if (kind === "presence") netPresence(m);
  else if (kind === "chat") netChat(m);
  else if (kind === "ctl") netCtl(m);
  else if (kind === "live") netLive(m);
}

function netPresence(m){
  if (!m || !m.id || m.id === NET.id) return;
  if (m.t === "leave"){
    if (NET.peers[m.id]){ delete NET.peers[m.id]; netRender(); }
    return;
  }
  var oldPeer = NET.peers[m.id] || {};
  if (oldPeer.mic !== undefined && !!oldPeer.mic !== !!m.mic && m.t !== "join" && S.voiceCues !== false){
    try{
      sfx(m.mic ? "bell" : "click");
      toast((m.n || "صاحبتك") + (m.mic ? " فتحت المايك" : " قفلت المايك"));
      say((m.n || "صاحبتك") + (m.mic ? " فتحت المايك" : " قفلت المايك"));
    }catch(e){}
  }
  NET.peers[m.id] = {n:m.n || "لاعبة", g:m.g || "بنت", s:m.s || 0, mic:!!m.mic, muted:!!m.muted, team:(m.team || oldPeer.team || ""), last:Date.now()};
  netRender();
}

function netChat(m){
  if (!m || m.id === NET.id) return;
  S.online.msgs.push({n:m.n || "صاحبتي", mine:false, audio:m.a || "", dur:m.d || 0, t:m.t || "", peer:""});
  if (S.online.msgs.length > 300) S.online.msgs.shift();
  if (cur !== "chat" || S.online.chatId) S.online.unread = (S.online.unread || 0) + 1;
  save();
  sfx("bell");
  toast("رسالة جديدة في الطاولة من " + (m.n || "صاحبتك"));
  if (cur === "chat" || cur === "room") render();
}

function netCtl(m){
  var room = S.online.room;
  if (!room || !room.live) return;
  if (m.t === "start"){ room.started = true; toast("المشرفة بدأت اللعبة"); }
  else if (m.t === "stop"){ room.started = false; toast("المشرفة وقفت اللعبة"); }
  else if (m.t === "restart"){ room.started = true; toast("اللعبة بدأت من الأول"); }
  else if (m.t === "close"){ toast("المشرفة قفلت الطاولة"); exitLive(); return; }
  else if (m.t === "mute"){
    if (m.id === NET.id){
      if (m.muted){ S.online.mic = false; if (PTT.on) pttStop(); toast("المشرفة كتمت المايك بتاعك"); }
      else toast("المشرفة فتحت المايك بتاعك");
    } else if (NET.peers[m.id]){
      NET.peers[m.id].muted = !!m.muted;
      if (m.muted) toast("مايك " + NET.peers[m.id].n + " اتكتم");
    }
  }
  else if (m.t === "kick" && m.id === NET.id){ toast("المشرفة طلعتك من الطاولة"); exitLive(); return; }
  else if (m.t === "team" && m.id){
    if (m.id === NET.id){ room.myTeam = m.team || ""; toast("المشرفة حطتك في " + (m.team === "A" ? (room.ta||"فريق أ") : (room.tb||"فريق ب"))); }
    else if (NET.peers[m.id]) NET.peers[m.id].team = m.team || "";
  }
  else if (m.t === "modes"){
    room.mode = m.mode || "compete";
    if (m.ta) room.ta = m.ta;
    if (m.tb) room.tb = m.tb;
    toast("وضع اللعبة بقى " + (room.mode === "team" ? "فرق" : "تحدي مطعمي أحلى"));
  }
  netRender();
}

function playerIndex(){
  var m = {};
  if (NET.id) m[NET.id] = {id:NET.id, n:S.online.nick, g:S.online.gender, s:myScore(), me:true, key:NET.id};
  for (var id in NET.peers){
    var p = NET.peers[id];
    if (!p || !p.n) continue;
    m[id] = {id:id, n:p.n, g:p.g || "بنت", s:p.s || 0, me:false, key:id};
  }
  for (var lid in NET.lb){
    var e = NET.lb[lid];
    if (!e || !e.n || lid === NET.id) continue;
    if (Date.now() - (e.ts || 0) > 86400000) continue;
    if (!m[lid]) m[lid] = {id:lid, n:e.n, g:e.g || "بنت", s:e.s || 0, me:false, key:lid};
  }
  for (var i=0;i<S.online.friends.length;i++){
    var f = S.online.friends[i];
    var fk = f.id || ("n:" + f.n);
    if (!m[fk]) m[fk] = {id:f.id || "", n:f.n, g:f.g || "بنت", s:f.s || 0, me:false, key:fk};
  }
  return m;
}
function isFriend(p){
  if (!p) return false;
  for (var i=0;i<S.online.friends.length;i++){
    var f = S.online.friends[i];
    if (p.id && f.id && f.id === p.id) return true;
    if (f.n === p.n) return true;
  }
  return false;
}
function addFriend(p){
  if (!p || !p.n || isFriend(p)) return false;
  S.online.friends.push({n:p.n, g:p.g || "بنت", id:p.id || "", s:p.s || 0});
  save();
  return true;
}
function chatName(id){
  if (!id) return "الطاولة";
  if (id === "__room") return "الطاولة";
  var idx = playerIndex();
  if (idx[id] && idx[id].n) return idx[id].n;
  for (var i=0;i<S.online.friends.length;i++){
    if (S.online.friends[i].id === id) return S.online.friends[i].n;
  }
  return "صاحبتي";
}
function openChat(a){
  var key = String(a === undefined || a === null ? "" : a);
  if (!key || key === "__room"){
    S.online.chatId = "__room"; S.online.chatWith = "الطاولة";
    S.online.unread = 0; save(); go("chat"); return;
  }
  var idx = playerIndex(), p = idx[key];
  if (!p){
    for (var k in idx){ if (idx[k].n === key){ p = idx[k]; break; } }
  }
  S.online.chatWith = p ? p.n : chatName(key);
  S.online.chatId = p ? (p.id || key) : key;
  S.online.unread = 0;
  save();
  go("chat");
}
function openChats(){
  S.online.chatId = "";
  S.online.chatWith = "";
  S.online.unread = 0;
  save();
  go("chat");
}
function netReq(m){
  if (!m || !m.id || m.id === NET.id) return;
  if (m.to && m.to !== NET.id) return;
  if (m.t === "acc"){
    if (S.online.blocked.indexOf(m.n) >= 0) return;
    addFriend({n:m.n || "لاعبة", g:m.g || "بنت", id:m.id, s:m.s || 0});
    sfx("success");
    toast((m.n || "اللاعبة") + " قبلت طلب صداقتك");
    netRender(); return;
  }
  if (m.t === "no"){ toast((m.n || "اللاعبة") + " رفضت طلب الصداقة"); return; }
  if (S.online.blocked.indexOf(m.n) >= 0) return;
  for (var i=0;i<S.online.reqs.length;i++){ if (S.online.reqs[i].n === m.n) return; }
  S.online.reqs.push({n:m.n || "لاعبة", g:m.g || "بنت", id:m.id, s:m.s || 0});
  S.online.unread = (S.online.unread || 0) + 1;
  save();
  sfx("bell");
  toast("طلب صداقة جديد من " + (m.n || "لاعبة"));
  netRender();
}

    c.online.rooms = [];
    c.online.view = null;

      ms.push({n:m.n, mine:!!m.mine, t:m.t||"", peer:m.peer||""});

function pushBackup(force){
  if (NET.state !== "on") return;
  var now = Date.now();
  if (!force && now - (S.backupAt || 0) < 60000) return;
  var p = backupPayload();
  S.backupAt = now;
  try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){}
  netPublishRetain(backupTopic(), p);
  if (force){ toast("اتحفظت نسخة على حسابك"); say("اتحفظت نسخة على حسابك"); }
}
function netSave(m){
  if (!m || !m.d || !m.at) return;
  if (m.at <= (S.backupAt || 0)) return;
  if (m.at <= (S.restoredAt || 0)) return;
  S.remoteSave = {at:m.at, nick:m.nick || "", d:m.d};
  try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){}
  toast("في نسخة محفوظة أحدث على حسابك — تقدري ترجعيها من الإعدادات");
  sfx("bell");
  if (cur === "home" || cur === "settings") render();

/* ===== الميكروفون المباشر — لاسلكي بين الموبايلات ===== */
var PTT = {on:false, mr:null, stream:null, t0:0};
var LIVEQ = [], LIVE_BUSY = false;
var LIVE_SENT = 0, LIVE_RECV = 0, LIVE_PLAY = 0, LIVE_ERR = "";

function pickMime(){
  var list = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"];
  for (var i = 0; i < list.length; i++){
    try{ if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(list[i])) return list[i]; }catch(e){}
  }
  return "";
}
function b64ToBlob(b64, mime){
  try{
    var raw = String(b64 || "").replace(/^data:[^,]*,/, "");
    if (!raw) return null;
    var bin = atob(raw);
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], {type: mime || "audio/webm"});
  }catch(e){ return null; }
}
function blobToB64(blob, cb){
  try{
    var fr = new FileReader();
    fr.onload = function(){ cb(String(fr.result || "").replace(/^data:[^,]*,/, "")); };
    fr.onerror = function(){};
    fr.readAsDataURL(blob);
  }catch(e){}
}
/* فتح الصوت في WebView من أول لمسة — من غيرها المتصفح بيمنع التشغيل */
var AU_OK = false;
var ACX = null;
function acx(){
  if (ACX) return ACX;
  try{
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    ACX = new C();
  }catch(e){ ACX = null; }
  return ACX;
}
function unlockAudio(){
  if (AU_OK) return;
  AU_OK = true;
  var c = acx();
  if (c && c.state === "suspended"){ try{ c.resume(); }catch(e){} }
  try{
    var a = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAAZGF0YQAAAAA=");
    a.volume = 0.01;
    var p = a.play();
    if (p && p.catch) p.catch(function(){});
  }catch(e){}
}
/* تشغيل أي صوت بمكبّر صوت — الباقة بتتقري بالعافي عليها من غير سماعات */
function playUrl(url, gainVal, cb){
  var el = null, src = null, done = false;
  var fin = function(){
    if (done) return;
    done = true;
    try{ el.pause(); }catch(e){}
    if (src){ try{ src.disconnect(); }catch(e){} }
    if (cb){ try{ cb(); }catch(e){} }
  };
  try{ el = new Audio(url); }catch(e){ if (cb) try{ cb(); }catch(e2){} return null; }
  var c = acx();
  if (c){
    try{
      if (c.state === "suspended"){ c.resume(); }
      src = c.createMediaElementSource(el);
      var g = c.createGain();
      g.gain.value = gainVal || 1;
      src.connect(g);
      g.connect(c.destination);
    }catch(e){ src = null; }
  }
  if (!src){ try{ el.volume = 1; }catch(e){} }
  el.onended = fin;
  el.onerror = fin;
  try{
    var pr = el.play();
    if (pr && pr.catch) pr.catch(function(){ fin(); });
  }catch(e){ fin(); }
  return el;
}

function pttStart(){
  if (!S.online.mic){ toast("الميكروفون مقفول — افتحيه الأول"); sfx("error"); return; }
  if (!NET.joined || NET.state !== "on"){ toast("لازم تكوني جوه طاولة ومتصلة بالقناة"); sfx("error"); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
    toast("الميكروفون مش متاح على الجهاز ده"); sfx("error");
    return;
  }
  if (PTT.on) return;
  unlockAudio();
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}}).then(function(st){
    PTT.stream = st;
    PTT.on = true;
    PTT.t0 = Date.now();
    sfx("click");
    toast("اتكلمي دلوقتي — صوتك بيسمع في الطاولة");
    render();
    recordSeg();
  }).catch(function(){
    toast("مش قادرة أفتح الميكروفون — اسمحي بالمايك من إعدادات التطبيق");
    sfx("error");
  });
}
/* كل مقطع بيتسجل لوحده وبيتقفل، فكل ملف بيطلع كامل ومقروء عند الطرف التاني */
function recordSeg(){
  if (!PTT.on || !PTT.stream) return;
  var mime = pickMime();
  var mr = null;
  try{ mr = mime ? new MediaRecorder(PTT.stream, {mimeType:mime, audioBitsPerSecond:24000}) : new MediaRecorder(PTT.stream); }
  catch(e){ try{ mr = new MediaRecorder(PTT.stream); }catch(e2){ PTT.on = false; toast("مش قادرة أسجل الصوت"); return; } }
  var chunks = [];
  mr.ondataavailable = function(e){ if (e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = function(){

function tapKey(el){

    if (STACK[STACK.length-1] !== cur) STACK.push(cur);
    if (STACK.length > 40) STACK.splice(0, STACK.length - 40);

  LAST_TAP = "";

}

function checkAch(){
  for (var i=0;i<ACH.length;i++){
    var a = ACH[i];
    if (S.ach.indexOf(a.id) >= 0) continue;
    var ok = false;
    try{ ok = a.chk(); }catch(e){}
    if (ok){
      S.ach.push(a.id);
      S.star += a.s; S.coin += 50;
      (function(txt){ setTimeout(function(){ toast(txt); }, 400); })("وسام جديد: " + a.n + " +" + a.s + " نجمة");
    }
  }
}

function missingList(){
  var dd = dayDishes();
  var need = {};
  for (var i=0;i<dd.length;i++){
    for (var k=0;k<dd[i].ing.length;k++){
      var key = dd[i].ing[k];
      need[key] = (need[key]||0) + 1;
    }
  }
  var out = "";
  for (var kk in need){
    var have = S.stock[kk]||0;
    if (have < need[kk]) out += '<span class="tag o">'+ING[kk]+' — محتاج '+(need[kk]-have)+'</span>';
  }
  return out || '<span class="tag g">كل المكونات موجودة</span>';
}

/* نغمة اختبار: بتبعت صوت حقيقي على القناة — لو صاحبتك سمعتها يبقى المسار شغال */
function toneWavBase64(){
  var sr = 8000, secs = 1.2, n = Math.floor(sr * secs), data = [];
  for (var i = 0; i < n; i++){
    var t = i / sr;
    var env = Math.min(1, i / 400) * Math.min(1, (n - i) / 400);
    var v = Math.sin(2 * Math.PI * 660 * t) * 0.6 * env;
    var b = Math.max(-1, Math.min(1, v));
    data.push((b * 32767) & 255, ((b * 32767) >> 8) & 255);
  }
  var head = [];
  function str(x){ for (var i = 0; i < x.length; i++) head.push(x.charCodeAt(i)); }
  function u32(v){ head.push(v & 255, (v >> 8) & 255, (v >> 16) & 255, (v >> 24) & 255); }
  function u16(v){ head.push(v & 255, (v >> 8) & 255); }
  str("RIFF"); u32(36 + data.length); str("WAVEfmt "); u32(16); u16(1); u16(1);
  u32(sr); u32(sr * 2); u16(2); u16(16); str("data"); u32(data.length);
  var all = head.concat(data), bin = "";
  for (var i = 0; i < all.length; i++) bin += String.fromCharCode(all[i]);
  return btoa(bin);
}

/* ===== 22. الأونلاين ===== */
var REC = {on:false, mr:null, chunks:[], stream:null, t0:0};
function recStart(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
    toast("الميكروفون مش متاح على الجهاز ده — اكتبي رسالتك والنظام هيقراها بصوت");
    return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
    REC.stream = st;
    REC.chunks = [];
    try{ REC.mr = new MediaRecorder(st, {mimeType:"audio/webm;codecs=opus", audioBitsPerSecond:16000}); }
    catch(e){ REC.mr = new MediaRecorder(st); }
    REC.mr.ondataavailable = function(e){ if (e.data && e.data.size) REC.chunks.push(e.data); };
    REC.mr.onstop = function(){
      var secs = Math.max(1, Math.round((Date.now() - REC.t0)/1000));
      var url = "", blob = null;
      try{
        blob = new Blob(REC.chunks, {type:"audio/webm"});
        url = URL.createObjectURL(blob);
      }catch(e){}
      var dmTo = S.online.chatId || "";
      if (dmTo === "__room") dmTo = "";
      S.online.msgs.push({n:S.online.nick, mine:true, audio:url, dur:secs, t:"", peer:dmTo});
      if (blob && (dmTo || NET.joined)){
        if (blob.size <= 120000){
          try{
            var fr = new FileReader();
            fr.onload = function(){
              var payload = {t:"dm", id:NET.id, n:S.online.nick, a:String(fr.result || ""), d:secs, t:""};
              try{
                if (dmTo) netPublish("dm/" + dmTo, payload);
                else netPublish("rooms/" + NET.joined + "/chat", {id:NET.id, n:S.online.nick, a:String(fr.result || ""), d:secs, t:""});
              }catch(e){}
            };
            fr.readAsDataURL(blob);
          }catch(e){}
        } else {
          toast("الرسالة الصوتية كبيرة على القناة — جربي تسجيل أقصر");
        }
      } else if (!dmTo && !NET.joined){
        toast("الرسالة اتسجلت عندك — محتاجة حد متصل عشان تسمعها");
      }
      try{ if (REC.stream) REC.stream.getTracks().forEach(function(tr){ tr.stop(); }); }catch(e){}
      REC.stream = null; REC.mr = null; REC.on = false;
      save();
      toast("اتبعتت رسالة صوتية مدتها " + secs + " ثانية");
      render();
    };
    REC.t0 = Date.now();
    REC.mr.start();
    REC.on = true;
    sfx("click");
    toast("التسجيل بدأ — اتكلمي، واضغطي تاني عشان تبعتي");
    render();
  }).catch(function(){
    toast("مش قادرة أفتح الميكروفون. اسمحي بالمايك من إعدادات التطبيق، أو اكتبي رسالتك والنظام هيقراها بصوت");
  });
}
function recStop(){
  if (!REC.mr){ REC.on = false; render(); return; }
  try{ REC.mr.stop(); }catch(e){ REC.on = false; }
}
function inviteCode(room){
  if (!room.code){
    var s = 0;
    for (var i=0;i<room.name.length;i++) s = (s*31 + room.name.charCodeAt(i)) % 90000;
    room.code = "KITCHEN-" + (10000 + s);
  }
  return room.code;
}
function rankList(room){
  var arr = [];
  if (room.live){
    for (var id in NET.peers){
      var q = NET.peers[id];
      arr.push({key:id, n:q.n, g:q.g, mic:q.mic, muted:q.muted, bot:false, me:false, score:q.s||0});
    }
  }
  for (var i=0;i<room.players.length;i++){
    var p = room.players[i];
    arr.push({key:String(i), n:p.n, g:p.g, mic:p.mic, muted:p.muted, bot:!!p.bot, me:false, score:p.score||0});
  }
  arr.push({key:"me", n:S.online.nick, g:S.online.gender, mic:S.online.mic, muted:false, me:true, score:myScore()});
  arr.sort(function(a,b){ return b.score - a.score; });
  return arr;
}
function roomPeopleCount(room){
  if (room.live) return Object.keys(NET.peers).length + 1;
  return room.players.length;
}
function teamScore(room, t){
  var sum = 0;
  if (room.live){
    for (var id in NET.peers){
      var q = NET.peers[id];
      if (q && q.team === t) sum += (q.s || 0);
    }
  }
  if ((room.myTeam || "A") === t) sum += myScore();
  return sum;
}

  );
  if (!o.friends.length){
    h += card("لسه مفيش صديقات",
      '<div class="small">دوّري على لاعبة بالاسم وابعتيلها طلب صداقة، ولما تقبل هتظهر هنا.</div>'+
      b("بحث بالاسم","go","find","g bigbtn"));
    return h;
  }
  var list = o.friends.slice(0);

    var ea = friendEntry(a) ? 1 : 0, eb = friendEntry(b) ? 1 : 0;

  });

SCREENS.chat = function(){
  var o = S.online;
  var cid = o.chatId || "";
  var h = head("الرسائل");
  var i, m;

  if (!cid){
    var groups = {}, order = [];
    for (i=0;i<o.msgs.length;i++){
      m = o.msgs[i];
      var gk = m.peer || "__room";
      if (!groups[gk]){ groups[gk] = {n:0, last:""}; order.push(gk); }
      groups[gk].n++;
      groups[gk].last = (m.mine ? "انتي: " : "") + (m.t || ("رسالة صوتية " + (m.dur||0) + " ثانية"));
    }
    var list = "";
    for (var k=0;k<order.length;k++){
      var gid = order[k], info = groups[gid];
      list += '<div class="kv"><span>'+chatName(gid)+
        '<div class="small">'+info.last+'</div></span><b>'+info.n+'</b></div>'+
        b("افتحي المحادثة","oChatOpen",gid,"p sm");
    }
    h += card("محادثاتك", list || '<div class="small">مفيش رسائل لسه. اول ما حد يبعتلك، المحادثة هتظهر هنا.</div>');
    h += card("ابعتيلها",
      '<div class="small">ابحثي عن لاعبة بالاسم وابعتيلها رسالة أو طلب صداقة.</div>'+
      b("بحث عن لاعبة","go","find","g bigbtn")+
      b("رسائل الطاولة","oChatOpen","__room","o bigbtn")
    );
    return h;
  }

  var withName = chatName(cid);
  h += card("محادثة مع " + withName,
    '<div class="small">'+(cid === "__room"
      ? "دي رسائل الطاولة — كل اللي فيها بيشوفوها."
      : "رسايلك هنا بتروح لـ "+withName+" لوحدها مع إشعار وصوت.")+'</div>'+
    b(REC.on?"اقفي التسجيل":"سجّلي رسالة صوتية","oRec",null,REC.on?"d bigbtn":"p bigbtn")+
    (REC.on ? '<div class="small">التسجيل شغال — اضغطي تاني عشان توقفي وتبعتي.</div>' : '')+
    b("كل المحادثات","oChats",null,"o sm")
  );
  var msgsHtml = "", count = 0;
  for (i=0;i<o.msgs.length;i++){
    m = o.msgs[i];
    var mp = m.peer || "";
    if (cid === "__room" ? mp !== "" : mp !== cid) continue;
    count++;
    msgsHtml += '<div class="kv"><span>'+(m.mine?"انتي":m.n)+
      '<div class="small">'+(m.t ? m.t : "رسالة صوتية "+(m.dur||0)+" ثانية")+'</div></span>'+
      b("اسمعي","oPlayMsg",String(i),"sm")+'</div>';
  }
  h += card("الرسائل ("+count+")", msgsHtml || '<div class="small">مفيش رسائل هنا لسه.</div>');
  h += card("اكتبي رسالة",
    '<input id="omsg" type="text" placeholder="اكتبي رسالة" aria-label="نص الرسالة">'+
    b("ابعتي","oSendMsg",null,"g bigbtn")
  );
  h += card("ملاحظة", '<div class="small">القناة مجانية ومش بتنقل مكالمات — بتنقل رسايل ومقاطع صوت قصيرة. لو صاحبتك مقفولة، رسالتك بتتسجل عندك.</div>');
  return h;
};

  );
  return h;
};

/* ===== المحرك: كل الأزرار ===== */
function fin(){ checkAch(); save(); render(); }
function earn(n){ S.pending += Math.max(0, Math.round(n)); }
function bumpRating(d){ S.rating = Math.max(1, Math.min(5, Math.round((S.rating + d)*100)/100)); }
function num(x){ var n = Number(x); return isFinite(n) ? n : 0; }

function makeGuest(vip){
  return {
    name: pick(NAMES),
    food: pick(DISHES).id,
    drink: pick(DRINKS).id,
    at: Date.now(),
    vip: !!vip
  };
}
function guestReward(g){
  var p = patLeft(g)/100;
  var base = dishBase(g.food) + 8;
  var tip = Math.round(base * (0.6 + p*0.8) * (g.vip?2:1));
  return tip;
}

function act(a, arg, arg2){
  var n = num(arg);
  switch(a){

  /* التنقل */
  case "back": back(); return;
  case "go": if (arg) go(String(arg)); return;
  case "photoBg": S.photoBg = n; fin(); return;

  /* 1. المطبخ */
  case "tray":
    if (!(S.stock[arg] > 0)){ toast("مفيش " + ING[arg] + " في المخزن"); return; }
    var ti = S.tray.indexOf(arg);
    if (ti >= 0){ S.tray.splice(ti,1); }
    else {
      if (S.tray.length >= 3){ toast("الصينية بتاخد 3 مكونات بس"); return; }
      S.tray.push(arg);
    }
    save(); render(); return;

  case "trayClear": S.tray = []; fin(); return;

  case "trayGuess":
    if (S.tray.length !== 3){ toast("اختاري 3 مكونات الأول"); return; }
    var match = null;
    for (var i=0;i<DISHES.length;i++){
      var okAll = true;
      for (var k=0;k<DISHES[i].ing.length;k++){
        if (S.tray.indexOf(DISHES[i].ing[k]) < 0){ okAll = false; break; }
      }
      if (okAll && DISHES[i].ing.length === S.tray.length){ match = DISHES[i]; break; }
    }
    if (match){
      toast("دي وصفة " + match.n + " — تقدر تطبخها من القائمة");
      say("المكونات دي بتعمل " + match.n);
    } else {
      toast("مكونات جديدة! سمّي الطبق من مربع الابتكار");
      say("دي وصفة جديدة. اكتبي اسمها وسعرها");
    }
    save(); render(); return;

  case "nameDish":
    if (S.tray.length !== 3){ toast("الصينية محتاجة 3 مكونات"); return; }
    var elN = document.getElementById("dname");
    var elP = document.getElementById("dprice");
    var nm = elN ? elN.value.replace(/^\s+|\s+$/g,"") : "";
    var pr = elP ? num(elP.value) : 0;
    if (nm.length < 2){ toast("اكتبي اسم للطبق"); return; }
    if (pr < 5){ toast("حددي سعر 5 عملات على الأقل"); return; }
    var exists = false;
    for (var q=0;q<S.recipes.length;q++) if (S.recipes[q].n === nm) exists = true;
    if (exists){ toast("فيه وصفة بنفس الاسم"); return; }
    S.recipes.push({ id:"r"+Date.now(), n:nm, ing:S.tray.slice(), base:Math.round(pr) });
    S.tray = []; give("xp",10);
    toast("الوصفة اتضافت للقائمة: " + nm);
    fin(); return;

  case "cookStart":
    var d = dishById(String(arg));
    if (!d){ toast("وصفة غير معروفة"); return; }
    if (!requirePower()) return;
    if (!hasIng(d.ing)){ toast("لسه ناقص: " + lackNames(d.ing).join(" و ") + " — اضغطي زرار هاتي الناقص جنب الطبق"); return; }
    useIng(d.ing);
    S.cook = { id:d.id, n:d.n, ing:d.ing.slice(), cut:0, done:0, temp:180, garn:[], burnt:false };
    go("cut"); return;

  case "cookCut":
    if (!S.cook){ toast("مفيش طبق"); return; }
    if (S.cook.cut >= 3){ toast("التقطيع خلص"); return; }
    S.cook.cut++;
    sfx("click");
    if (S.cook.cut >= 3) say("التقطيع خلص. تقدري تروحي للطهي");
    fin(); return;

  case "cookToStove":
    if (!S.cook) return;
    if (S.cook.cut < 3){ toast("لسه محتاج تقطيع"); return; }
    go("stove"); return;

  case "setTemp":
    if (!S.cook) return;
    S.cook.temp = n;
    save(); render();
    say("درجة الحرارة " + n + " درجة");
    return;

  case "cookProgress":
    if (!S.cook) return;
    if (!requirePower()) return;
    var c = S.cook;
    var temp = c.temp || 180;
    var inc;
    if (temp === 160) inc = rnd(12,18);
    else if (temp === 180) inc = rnd(20,28);
    else if (temp === 200) inc = rnd(26,34);
    else inc = rnd(34,44);
    c.done = Math.min(110, c.done + inc);
    if (temp === 220 && Math.random() < 0.32) c.burnt = true;
    if (temp === 200 && Math.random() < 0.1) c.burnt = true;
    if (c.done >= 100){ c.done = 100; c.burnt = c.burnt || temp >= 220; }
    if (c.burnt) say("خدي بالك! الطبق بدأ يتحرق");
    else if (c.done >= 50) say("الطبق استوى. تقدري ترفعيه");
    else say("لسه بيستوي");
    fin(); return;

  case "cookToDeco":
    if (!S.cook) return;
    if (S.cook.done < 50){ toast("لسه محتاج نضج أكتر"); return; }
    go("deco"); return;

  case "garnish":
    if (!S.cook) return;
    var gi = S.cook.garn.indexOf(n);
    if (gi >= 0) S.cook.garn.splice(gi,1);
    else {
      if (S.cook.garn.length >= 3){ toast("3 لمسات تكفي"); return; }
      S.cook.garn.push(n);
    }
    save(); render(); return;

  case "cookRate":
    if (!S.cook){ toast("مفيش طبق"); return; }
    var cc = S.cook;
    var score = 38 + Math.min(3, cc.cut) * 8;
    score += Math.min(100, cc.done) * 0.18;
    score += cc.garn.length * 6;
    if (cc.burnt) score -= 28;
    if (cc.temp === 180) score += 6;
    if (S.spices > 0){ S.spices--; score += 6; }
    if (S.secrets.book) score += 5;
    var facAvg = 0, facCnt = 0;
    for (var fk in S.fac){ facAvg += S.fac[fk]; facCnt++; }
    if (facCnt) score += (facAvg/facCnt) * 1.6;
    score += (S.tools.knife + S.tools.pan + S.tools.mixer) * 1.5;
    if (S.magic){ score += 10; S.magic = false; }
    score = Math.max(5, Math.min(100, Math.round(score)));
    var stars = Math.max(1, Math.min(5, Math.round(score/20)));
    var coin = Math.round(dishBase(cc.id) * (0.7 + score/140));
    var rstar = score >= 90 ? 2 : (score >= 70 ? 1 : 0);
    var xp = 8 + Math.round(score/12);
    var heart = score >= 85 ? 1 : 0;
    var note = cc.burnt ? "الطبق اتحرق شوية — خففي الحرارة المرة الجاية" :
               score >= 85 ? "طبق مثالي! ريحة المطبخ حلوة" :
               score >= 65 ? "طبق حلو ومرتب" : "طبق بسيط ومحتاج شغل أكتر";
    S.lastRate = { n:cc.n, score:score, stars:stars, note:note, coin:coin, star:rstar, xp:xp, heart:heart };
    earn(coin);
    if (rstar) S.star += rstar;
    if (heart) give("heart", heart);
    give("xp", xp);
    S.ready.push({ n:cc.n, id:cc.id, stars:stars, score:score });
    S.dishesMade++;
    S.dirty++;
    S.day.cook++;
    bumpRating((stars - 3) * 0.12);
    S.cook = null;
    toast("الطبق جاهز: " + score + " من 100");
    fin(); go("rate", true); return;

  /* 2. المخزن والكهرباء */
  case "breaker":
    if (S.breakers[arg] === undefined){ toast("قاطع غير معروف"); return; }
    S.breakers[arg] = !S.breakers[arg];
    var p1 = S.breakers.main && S.breakers.kitchen && S.breakers.hall;
    S.power = p1;
    sfx(S.breakers[arg] ? "click" : "error");
    toast(p1 ? "الكهرباء شغالة في كل المطعم" : (S.breakers[arg] ? "قاطع " + arg + " اتفتح — باقي القواطع" : "قاطع " + arg + " اتقفل"));
    fin(); return;

  case "buyFresh":
    if (!spend(30)) return;
    S.stock.tomato+=2; S.stock.cucumber+=2; S.stock.milk+=2; S.stock.fruit+=2; S.stock.herb+=1;
    toast("وصلت المؤن الطازجة للثلاجة"); fin(); return;

  case "buyMeat":
    if (!spend(35)) return;
    S.stock.meat+=3; toast("وصل اللحم المجمد للفريزر"); fin(); return;

  case "buySpice":
    if (!spend(25)) return;
    S.spices++; toast("بهارات جديدة على الرف"); fin(); return;

  case "wash":
    if (S.dirty <= 0){ toast("مفيش أطباق متسخة"); return; }
    var costW = S.fac.dishwasher > 0 ? 0 : Math.min(S.dirty, 5) * 2;
    if (costW && !spend(costW)) return;
    S.dirty = S.fac.dishwasher > 0 ? 0 : Math.max(0, S.dirty - 5);
    S.washes++;
    give("xp",5);
    bumpRating(0.05);
    toast(S.fac.dishwasher > 0 ? "غسالة الصحون خلصت كل حاجة" : "الأطباق اتنضفت");
    fin(); return;

  case "buyDish":
    var bd = dishById(String(arg));
    if (!bd){ toast("الطبق مش موجود"); return; }
    var needB = {}, costB = 0, gotB = [];
    for (var bi=0;bi<bd.ing.length;bi++){ var bk = bd.ing[bi]; if (!ING[bk]) continue; needB[bk] = (needB[bk]||0) + 1; }
    for (var bn in needB){ var lackB = needB[bn] - (S.stock[bn]||0); if (lackB > 0){ costB += lackB * 12; gotB.push(ING[bn]); } }
    if (!gotB.length){ toast("كل مكونات " + bd.n + " موجودة"); sfx("click"); return; }
    if (!spend(costB)) return;
    for (var bn2 in needB){ var lb = needB[bn2] - (S.stock[bn2]||0); if (lb > 0) S.stock[bn2] = (S.stock[bn2]||0) + lb; }
    sfx("buy");
    toast("اشتريت الناقص لـ " + bd.n + ": " + gotB.join(" و ") + " — " + costB + " عملة");
    fin(); return;

  case "buyMissing":
    var need = {};
    var dd = dayDishes();
    for (var i2=0;i2<dd.length;i2++) for (var k2=0;k2<dd[i2].ing.length;k2++){
      var kk = dd[i2].ing[k2]; need[kk] = (need[kk]||0) + 1;
    }
    var costM = 0, units = 0;
    for (var kk2 in need){ var lack = need[kk2] - (S.stock[kk2]||0); if (lack > 0){ units += lack; costM += lack*12; } }
    if (units === 0){ toast("كل مكونات اليوم موجودة"); return; }
    if (!spend(costM)) return;
    for (var kk3 in need){ var l3 = need[kk3] - (S.stock[kk3]||0); if (l3 > 0) S.stock[kk3] = (S.stock[kk3]||0) + l3; }
    toast("اشتريت الناقص — " + units + " مكون"); fin(); return;

  case "trash":
    var got = rnd(1,3);
    S.recycleMat += got;
    toast("جمعتي " + got + " خامات لإعادة التدوير");
    fin(); return;

  case "buyIng":
    var prices = {tomato:12,cucumber:10,meat:22,flour:9,sugar:8,choco:16,milk:10,herb:9,fruit:14};
    var prc = prices[arg];
    if (!prc){ toast("مكون غير معروف"); return; }
    if (!spend(prc)) return;
    S.stock[arg] = (S.stock[arg]||0) + 1;
    sfx("buy");
    toast("اشتريت " + ING[arg]);
    fin(); return;

  /* 3. الديكور */
  case "upDeco":
    var dCost = {bath:120,chairs:90,tableDeco:80,furniture:150,light:70,corner:110};
    var dl = S.deco[arg];
    if (dl === undefined){ toast("ديكور غير معروف"); return; }
    if (dl >= 5){ toast("وصلتي لأعلى مستوى هنا"); return; }
    if (!spend(dCost[arg])) return;
    S.deco[arg]++;
    bumpRating(0.08);
    give("xp",6);
    toast("الديكور اتطور — المستوى " + S.deco[arg]);
    fin(); return;

  case "upFac":
    var fCost = {microwave:140,oven:160,fryer:150,dishwasher:180,espresso:120,blender:100,tea:90};
    var fl = S.fac[arg];
    if (fl === undefined){ toast("جهاز غير معروف"); return; }
    if (fl >= 5){ toast("الجهاز في أعلى مستوى"); return; }
    if (!spend((fl+1)*fCost[arg])) return;
    S.fac[arg]++;
    give("xp",8);
    toast("الجهاز اتطور — المستوى " + S.fac[arg]);
    fin(); return;

  case "upTool":
    var tCost = {knife:90,pan:110,mixer:130};
    var tl = S.tools[arg];
    if (tl === undefined){ toast("أداة غير معروفة"); return; }
    if (tl >= 5){ toast("الأداة في أعلى مستوى"); return; }
    if (!spend((tl+1)*tCost[arg])) return;
    S.tools[arg]++;
    give("xp",7);
    toast("الأداة اتطورت — مستوى " + S.tools[arg]);
    fin(); return;

  case "upMarble":
    if (S.marble >= 5){ toast("الرخامة في أعلى حجم"); return; }
    if (!spend(200*(S.marble+1))) return;
    S.marble++;
    bumpRating(0.05);
    give("xp",10);
    toast("الرخامة كبرت — مساحة تحضير أوسع");
    fin(); return;

  /* 4. الطاولات */
  case "arrive":
    var free = -1;
    for (var t=0;t<S.tables.length;t++) if (!S.tables[t]){ free = t; break; }
    if (free < 0){ toast("كل الطاولات مشغولة"); return; }
    S.tables[free] = makeGuest(S.vipMode);
    var g0 = S.tables[free];
    S.vipMode = false;
    sfx("bell");
    toast("دخلت زبونة اسمها " + g0.name + " على طاولة " + (free+1) + ". طلبت " + dishName(g0.food) + " ومعاها " + drinkName(g0.drink) + ". حضّري الطلب وبعدها اضغطي تقديم الطلب");
    fin(); return;

  case "vipNext":
    S.vipMode = !S.vipMode;
    toast(S.vipMode ? "الزبونة الجاية VIP — مكافآت مضاعفة" : "تم إلغاء وضع VIP");
    fin(); return;

  case "callStaff":
    if (S.staff.waiter <= 0){ toast("مفيش نادلة. وظّفي واحدة من القسم"); return; }
    if (cdLeft("staff", 20000) > 0){ toast("النادلة مشغولة — انتظري " + cdLeft("staff",20000) + " ث"); return; }
    cdStart("staff");
    var servedOne = false;
    for (var t2=0;t2<S.tables.length;t2++){
      var g2 = S.tables[t2];
      if (!g2) continue;
      var ix = -1;
      for (var r2=0;r2<S.ready.length;r2++) if (S.ready[r2].id === g2.food){ ix = r2; break; }
      var di = S.readyDrinks.indexOf(g2.drink);
      if (ix >= 0 && di >= 0){
        S.ready.splice(ix,1); S.readyDrinks.splice(di,1);
        var rw = guestReward(g2);
        earn(rw); S.served++; S.day.serve++; S.week.serve++;
        bumpRating(0.06);
        S.tables[t2] = null;
        servedOne = true;
        toast("النادلة خدمت طاولة " + (t2+1) + " — +" + rw + " في الكاشير");
        break;
      }
    }
    if (!servedOne) toast("مفيش طلب جاهز النادلة تقدمه");
    fin(); return;

  case "serve":
    var gs = S.tables[n];
    if (!gs){ toast("الطاولة فاضية"); return; }
    var ridx = -1;
    for (var r3=0;r3<S.ready.length;r3++) if (S.ready[r3].id === gs.food){ ridx = r3; break; }
    if (ridx < 0){ toast("محتاجة تطبخي " + dishName(gs.food) + " الأول"); return; }
    var didx = S.readyDrinks.indexOf(gs.drink);

    toast("مبروك! عجلة الحظ جابت لك 10000 عملة و 5000 قلب ❤️");
    fin(); return;

  case "weekClaim":
    if (S.week.claimed){ toast("استلمتي الوسام هذا الأسبوع"); return; }
    if (S.week.serve < 15){ toast("محتاجة تخدمي 15 زبونة هذا الأسبوع"); return; }
    S.week.claimed = true;
    S.star += 5;
    give("coin",300);
    toast("وسام الشيف الذهبي الملكي بقى ليكي! +5 نجوم");
    fin(); return;

  case "claimDaily":
    if (S.day.claims.indexOf(arg) >= 0){ toast("اتسلمت النهارده"); return; }
    if (arg === "cook"){
      if (S.day.cook < 3){ toast("لسه محتاجة تطبخي 3 أطباق"); return; }
      S.day.claims.push("cook");
      give("coin",60); S.star += 1;
      toast("تحدي الطبخ خلص — +60 عملة");
    } else if (arg === "serve"){
      if (S.day.serve < 3){ toast("لسه محتاجة تخدمي 3 زبائن"); return; }
      S.day.claims.push("serve");
      give("coin",60); S.star += 1;
      toast("تحدي الخدمة خلص — +60 عملة");
    }
    fin(); return;

  /* 25. النكهات */
  case "flavor":
    if (!spend(25)) return;
    var f1 = pick(Object.keys(ING)), f2 = pick(Object.keys(ING));
    var names = [ING[f1], ING[f2]];
    S.experiments.push({ n:"تجربة " + (S.experiments.length+1), d:names[0] + " + " + names[1] + " — طعم " + pick(["حلو","حامي","غريب","لذيذ","مجنون"]) });
    if (S.experiments.length > 30) S.experiments.shift();
    if (Math.random() < 0.2){ S.magic = true; toast("طلعت نكهة سحرية! هتتحسب في الطبق الجاي"); }
    else toast("تجربة جديدة اتسجلت في السجل");
    fin(); return;

  case "magicOn":
    if (S.magic){ toast("النكهة السحرية جاهزة بالفعل"); return; }
    if (!spend(50)) return;
    S.magic = true;
    toast("الماكينة شغالة — الطبق الجاي هيكون مميز");
    fin(); return;

  /* 26. الروبوت */
  case "robotToggle":
    if (!S.robot.on){
      if (!spend(300)) return;
      S.robot.on = true;
      S.robot.owns = true;
      toast("الروبوت المساعد اتشغل — بيغسل وينظّم");
    } else {
      S.robot.on = false;
      toast("الروبوت اتوقف");
    }
    fin(); return;

  case "robotBat":
    if (S.robot.bat >= 5){ toast("البطارية في أعلى مستوى"); return; }
    if (!spend((S.robot.bat+1)*80)) return;
    S.robot.bat++;
    toast("البطارية اتقوت — مستوى " + S.robot.bat);
    fin(); return;

  case "robotColor":
    if (!spend(40)) return;
    S.robot.color = (S.robot.color + 1) % 4;
    toast("شكل الروبوت اتغير");
    fin(); return;

  /* 27. الطقس */
  case "winter":
    if (!S.winter){ if (!spend(120)) return; S.winter = true; bumpRating(0.05); toast("ركن المشروبات الساخنة اتفتح"); }
    else { S.winter = false; toast("الركن اتقفل"); }
    fin(); return;

  case "umbrella":
    if (!S.umbrellas){ if (!spend(90)) return; S.umbrellas = true; toast("المظلات اتجهزت للمطر والثلج"); }
    else { S.umbrellas = false; toast("المظلات اتشالت"); }
    fin(); return;

  /* 28. الإحصائيات */
  case "badgeAward":
    if (S.rating < 4){ toast("وسام الأداء محتاج تقييم 4 نجوم"); return; }
    if (S.cd.badgeAward && Date.now() - S.cd.badgeAward < 86400000){ toast("استلمتي الوسام النهارده"); return; }
    S.cd.badgeAward = Date.now();
    S.star += 2;
    give("coin",100);
    toast("وسام الأداء المتميز — +2 نجمة");
    fin(); return;

  case "idea":
    if (!spend(45)) return;
    var ia = pick(Object.keys(ING)), ib = pick(Object.keys(ING)), ic = pick(Object.keys(ING));
    S.experiments.push({ n:"فكرة وصفة " + (S.experiments.length+1), d:ING[ia] + " + " + ING[ib] + " + " + ING[ic] });
    if (S.experiments.length > 30) S.experiments.shift();
    toast("فكرة جديدة: " + ING[ia] + " + " + ING[ib] + " + " + ING[ic]);
    fin(); return;

  default:
    toast("الزر ده مش متاح");
    return;
  }
}

/* ===== التشغيل ===== */
try{ if (location.hash === "#reset") localStorage.removeItem(LS); }catch(e){}
load();
try{
  if (!S.readerManual && window.Native && window.Native.screenReader && window.Native.screenReader()){
    S.readerMode = true;
  }
}catch(e){}
try{ document.body.className = S.bigText ? "big" : ""; }catch(e){}
render();
try{ setTimeout(netInit, 800); }catch(e){}
try{ setTimeout(checkUpdate, 2500); }catch(e){}
</script>
</body>
</html>
